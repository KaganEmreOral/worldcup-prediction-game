# Phase 2 — HTTPS (use AFTER certbot certificates are issued)
# Install:
#   sudo cp deploy/nginx/worldcupytu.org.conf /etc/nginx/sites-available/worldcupytu.org
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# MUST be 3010/8010 on shared VPS — port 3000/8000 is used by other sites (e.g. maltamentor.com)
upstream worldcup_frontend {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream worldcup_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

# HTTP → HTTPS redirect (keeps ACME path reachable)
server {
    listen 80;
    listen [::]:80;
    server_name worldcupytu.org www.worldcupytu.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name worldcupytu.org www.worldcupytu.org;

    ssl_certificate     /etc/letsencrypt/live/worldcupytu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldcupytu.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Optional: canonical www → apex (comment out if you prefer www as primary)
    if ($host = www.worldcupytu.org) {
        return 301 https://worldcupytu.org$request_uri;
    }

    location /api/ {
        limit_req zone=worldcup_api burst=50 nodelay;
        proxy_pass http://worldcup_backend;
        include /etc/nginx/snippets/worldcup-proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=worldcup_auth burst=10 nodelay;
        proxy_pass http://worldcup_backend;
        include /etc/nginx/snippets/worldcup-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=worldcup_auth burst=10 nodelay;
        proxy_pass http://worldcup_backend;
        include /etc/nginx/snippets/worldcup-proxy.conf;
    }

    location /docs {
        proxy_pass http://worldcup_backend/docs;
        include /etc/nginx/snippets/worldcup-proxy.conf;
    }

    location /openapi.json {
        proxy_pass http://worldcup_backend/openapi.json;
        include /etc/nginx/snippets/worldcup-proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://worldcup_frontend;
        include /etc/nginx/snippets/worldcup-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://worldcup_frontend;
        include /etc/nginx/snippets/worldcup-proxy.conf;
        include /etc/nginx/snippets/worldcup-proxy-ws.conf;
    }

    # Fail2ban-friendly access log (optional separate log)
    access_log /var/log/nginx/worldcupytu.org.access.log;
    error_log  /var/log/nginx/worldcupytu.org.error.log warn;
}
