# Install to: /etc/nginx/conf.d/worldcup-limits.conf
# Included automatically from sites-enabled; does not affect other vhosts.

# Auth endpoints: ~5 requests/minute per IP (burst allows short bursts)
limit_req_zone $binary_remote_addr zone=worldcup_auth:10m rate=5r/m;

# General API: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=worldcup_api:10m rate=30r/s;
